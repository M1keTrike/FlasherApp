# Configuración FINAL de nginx (HTTP + HTTPS).
# Úsala solo cuando el certificado SSL ya exista (ver README → emisión SSL).
# Para la PRIMERA emisión, usa primero nginx/bootstrap/flasher-bootstrap.conf.

# ---------- Puerto 80: ACME challenge + redirección a HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name flasherapi.alphahills.site;

    # Certbot valida el dominio sirviendo este path desde el webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás se redirige a HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- Puerto 443: terminación SSL + reverse proxy a la API ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name flasherapi.alphahills.site;

    ssl_certificate /etc/letsencrypt/live/flasherapi.alphahills.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flasherapi.alphahills.site/privkey.pem;

    location / {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
