# Configuración TEMPORAL solo para la primera emisión del certificado.
# nginx no puede arrancar con el bloque 443 si el certificado aún no existe,
# así que primero servimos únicamente el puerto 80 con el ACME challenge.
#
# Uso (ver README):
#   1. Copia este archivo a nginx/conf.d/ (reemplazando flasher.conf temporalmente)
#   2. docker compose up -d nginx
#   3. Emite el certificado con certbot (webroot)
#   4. Restaura flasher.conf y recarga nginx

server {
    listen 80;
    listen [::]:80;
    server_name flasherapi.alphahills.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'Flasher API - esperando emisión de certificado SSL\n';
        add_header Content-Type text/plain;
    }
}
